version: '3.8'

services:
  redis:
    image: redis:7
    container_name: livesync-redis
    ports:
      - "6379:6379"
    restart: always
  db:
    image: mysql:8.0
    container_name: livesync-db
    env_file: .env
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: livesync
      TZ: Asia/Seoul
    volumes:
      - ./mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - livesync-network

networks:
  livesync-network:
    driver: bridge